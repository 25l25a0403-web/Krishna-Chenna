<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>A Special Surprise</title>
    
    <!-- Google Fonts & FontAwesome -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
        }

        body {
            background-color: #030005;
            font-family: 'Poppins', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            color: #fff;
            overflow-x: hidden;
        }

        /* App Shell Frame */
        .app-container {
            width: 100%;
            max-width: 430px;
            height: 900px;
            max-height: 100vh;
            position: relative;
            background: #090211;
            box-shadow: 0 0 60px rgba(186, 0, 255, 0.25);
            overflow: hidden;
            border-radius: 16px;
        }

        /* Background Layer Container with subtle movement animation */
        .bg-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: url('https://i.ibb.co/L5fN8s0/1000260940.jpg'); /* Exact image source */
            background-size: cover;
            background-position: center;
            animation: subtleGlow 4s ease-in-out infinite alternate;
        }

        @keyframes subtleGlow {
            0% { transform: scale(1); filter: brightness(1); }
            100% { transform: scale(1.015); filter: brightness(1.08); }
        }

        /* Cover Mask: Seamlessly hides "The Birthday Experience", "SCENE 1", and Top-Left Music Icon */
        .header-mask-top-left {
            position: absolute;
            top: 15px;
            left: 15px;
            width: 50px;
            height: 50px;
            background: radial-gradient(circle, #10031c 80%, transparent 100%);
            border-radius: 50%;
            z-index: 5;
        }

        .header-mask-center {
            position: absolute;
            top: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 82%;
            height: 120px;
            background: radial-gradient(ellipse at top, #13011a 60%, rgba(19, 1, 26, 0.95) 85%, transparent 100%);
            z-index: 5;
        }

        /* Floating Particle Layer */
        #particles-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 4;
        }

        /* Top Bar Navigation Header */
        .top-bar {
            position: absolute;
            top: 20px;
            left: 0;
            width: 100%;
            padding: 0 20px;
            display: flex;
            justify-content: flex-end;
            align-items: center;
            z-index: 10;
        }

        .icon-btn {
            width: 42px;
            height: 42px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.25);
            display: flex;
            justify-content: center;
            align-items: center;
            color: #fff;
            font-size: 16px;
            backdrop-filter: blur(8px);
            box-shadow: 0 0 12px rgba(0, 0, 0, 0.5);
            cursor: pointer;
        }

        /* Overlay Content Layout */
        .content {
            position: relative;
            z-index: 10;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 25px 20px 30px 20px;
        }

        /* Clean Replacement Header Text */
        .header-title-box {
            text-align: center;
            margin-top: 35px;
        }

        .title-text {
            font-size: 30px;
            font-weight: 700;
            color: #ffffff;
            text-shadow: 0 0 15px rgba(255, 255, 255, 0.6), 0 0 25px rgba(255, 64, 129, 0.5);
            letter-spacing: 0.5px;
        }

        .subtitle-text {
            font-size: 13.5px;
            color: #d1b3e0;
            margin-top: 4px;
            font-weight: 400;
        }

        .subtitle-text span {
            color: #ffcc00;
            font-weight: 600;
        }

        /* Heart Divider Lines */
        .divider {
            display: flex;
            align-items: center;
            gap: 8px;
            margin: 6px 0;
            color: #ff4081;
            font-size: 11px;
        }

        .divider .line {
            width: 40px;
            height: 1px;
            background: linear-gradient(90deg, transparent, #ff4081, transparent);
        }

        /* Subtle Breathing Animation Overlay for Teddy Area */
        .teddy-motion-overlay {
            position: absolute;
            top: 26%;
            left: 12%;
            width: 48%;
            height: 32%;
            pointer-events: none;
            z-index: 3;
            animation: teddyBreath 3.5s ease-in-out infinite alternate;
        }

        @keyframes teddyBreath {
            0% { transform: translateY(0) scale(1); }
            100% { transform: translateY(-4px) scale(1.015); }
        }

        /* Spacer pushes lower UI overlay cards to match screenshot alignment */
        .spacer {
            flex-grow: 1;
        }

        /* Live Countdown Card */
        .timer-card {
            width: 100%;
            background: rgba(18, 5, 28, 0.75);
            border: 1.5px solid #a832a4;
            border-radius: 22px;
            padding: 16px 12px;
            box-shadow: 0 0 25px rgba(168, 50, 164, 0.4), inset 0 0 12px rgba(168, 50, 164, 0.2);
            backdrop-filter: blur(10px);
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-bottom: 12px;
        }

        .timer-header {
            display: flex;
            align-items: center;
            gap: 8px;
            color: #ffffff;
            font-size: 15px;
            font-weight: 600;
            margin-bottom: 10px;
        }

        .timer-header i {
            color: #ff4081;
            font-size: 13px;
        }

        .timer-display {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .time-block {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .time-box {
            background: #11021c;
            border: 1.5px solid #ff4081;
            border-radius: 12px;
            width: 68px;
            height: 52px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Fredoka', sans-serif;
            font-size: 28px;
            font-weight: 700;
            color: #ffcc00;
            box-shadow: 0 0 12px rgba(255, 64, 129, 0.4), inset 0 0 8px rgba(0,0,0,0.8);
        }

        .time-label {
            font-size: 11px;
            color: #c4a9d4;
            margin-top: 5px;
            font-weight: 400;
        }

        .colon-separator {
            font-family: 'Fredoka', sans-serif;
            font-size: 22px;
            color: #ff4081;
            font-weight: bold;
            margin-bottom: 18px;
        }

        /* Wish Banner */
        .wish-banner {
            width: 100%;
            border: 1.5px dashed #8e24aa;
            border-radius: 16px;
            padding: 10px 14px;
            background: rgba(15, 3, 24, 0.65);
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 12px;
            backdrop-filter: blur(6px);
        }

        .wish-icon-left {
            font-size: 26px;
            color: #ffcc00;
            filter: drop-shadow(0 0 8px rgba(255, 204, 0, 0.7));
        }

        .wish-icon-right {
            font-size: 24px;
            color: #ff4081;
            filter: drop-shadow(0 0 8px rgba(255, 64, 129, 0.7));
        }

        .wish-text {
            text-align: center;
            font-size: 12px;
            color: #e2d5e8;
            line-height: 1.4;
            flex: 1;
            padding: 0 8px;
        }

        .wish-text span {
            color: #ffcc00;
        }

        /* Bottom Notification Card */
        .notification-card {
            width: 100%;
            background: rgba(18, 5, 28, 0.75);
            border: 1.5px solid #8e24aa;
            border-radius: 16px;
            padding: 8px 14px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            box-shadow: 0 0 15px rgba(142, 36, 170, 0.25);
            backdrop-filter: blur(8px);
        }

        .notif-left {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .clock-badge {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: rgba(255, 64, 129, 0.15);
            border: 1px solid #ff4081;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #fff;
            font-size: 13px;
        }

        .notif-text {
            font-size: 11px;
            color: #d1b3e0;
            line-height: 1.3;
        }

        .bell-icon {
            font-size: 22px;
            color: #ffcc00;
            filter: drop-shadow(0 0 6px rgba(255, 204, 0, 0.6));
            animation: bellRing 2s infinite ease-in-out;
        }

        @keyframes bellRing {
            0%, 100% { transform: rotate(0); }
            10%, 30%, 50% { transform: rotate(12deg); }
            20%, 40% { transform: rotate(-12deg); }
            60% { transform: rotate(0); }
        }

        /* Let's Go Button (Appears automatically when timer finishes) */
        .lets-go-btn {
            display: none;
            width: 100%;
            margin-top: 10px;
            padding: 15px;
            background: linear-gradient(90deg, #ff4081, #ff80ab);
            border: none;
            border-radius: 30px;
            color: #fff;
            font-size: 18px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            cursor: pointer;
            box-shadow: 0 0 30px rgba(255, 64, 129, 0.9);
            animation: pulseBtn 1.5s infinite alternate;
            z-index: 20;
        }

        @keyframes pulseBtn {
            0% { transform: scale(0.98); box-shadow: 0 0 15px rgba(255, 64, 129, 0.6); }
            100% { transform: scale(1.03); box-shadow: 0 0 35px rgba(255, 64, 129, 1); }
        }
    </style>
</head>
<body>

    <div class="app-container">
        <!-- Background Layer -->
        <div class="bg-layer"></div>

        <!-- Mask to remove music icon and top text headers -->
        <div class="header-mask-top-left"></div>
        <div class="header-mask-center"></div>

        <!-- Breathing Motion Effect Overlay over Teddy -->
        <div class="teddy-motion-overlay"></div>

        <!-- Particle Effect Layer -->
        <canvas id="particles-canvas"></canvas>

        <!-- Top Right Audio Icon (Music icon on left removed) -->
        <div class="top-bar">
            <div class="icon-btn" id="sound-toggle">
                <i class="fa-solid fa-volume-high"></i>
            </div>
        </div>

        <!-- Main Content Overlay -->
        <div class="content">
            
            <div class="header-title-box">
                <div class="title-text">A Special Surprise</div>
                <div class="subtitle-text">The magic will reveal at the <span>right time...</span></div>
                <div class="divider">
                    <i class="fa-solid fa-heart"></i>
                    <div class="line"></div>
                    <i class="fa-solid fa-heart"></i>
                </div>
            </div>

            <div class="spacer"></div>

            <!-- Countdown Timer Block -->
            <div class="timer-card">
                <div class="timer-header">
                    <i class="fa-solid fa-heart"></i>
                    <i class="fa-regular fa-calendar-days"></i>
                    <span>Surprise Reveals In</span>
                    <i class="fa-solid fa-heart"></i>
                </div>
                <div class="timer-display">
                    <div class="time-block">
                        <div class="time-box" id="hours">02</div>
                        <div class="time-label">Hours</div>
                    </div>
                    <div class="colon-separator">:</div>
                    <div class="time-block">
                        <div class="time-box" id="minutes">15</div>
                        <div class="time-label">Minutes</div>
                    </div>
                    <div class="colon-separator">:</div>
                    <div class="time-block">
                        <div class="time-box" id="seconds">37</div>
                        <div class="time-label">Seconds</div>
                    </div>
                </div>
            </div>

            <!-- Wish Box -->
            <div class="wish-banner">
                <i class="fa-solid fa-star wish-icon-left"></i>
                <div class="wish-text">
                    Your <span>special wish</span> is on the way...<br>
                    Hang tight, it will be worth the wait!
                </div>
                <i class="fa-regular fa-heart wish-icon-right"></i>
            </div>

            <!-- Notification Bottom Bar -->
            <div class="notification-card">
                <div class="notif-left">
                    <div class="clock-badge">
                        <i class="fa-regular fa-clock"></i>
                    </div>
                    <div class="notif-text">
                        You will get a notification<br>when the surprise is ready!
                    </div>
                </div>
                <i class="fa-solid fa-bell bell-icon"></i>
            </div>

            <!-- "Let's Go!" Button -->
            <button class="lets-go-btn" id="lets-go-btn">Let's Go!</button>

        </div>
    </div>

    <!-- Live Canvas Floating Particle Engine & Countdown Script -->
    <script>
        // Floating Heart, Star, and Sparkle Particle System
        const canvas = document.getElementById('particles-canvas');
        const ctx = canvas.getContext('2d');

        function resizeCanvas() {
            canvas.width = canvas.parentElement.clientWidth;
            canvas.height = canvas.parentElement.clientHeight;
        }
        resizeCanvas();
        window.addEventListener('resize', resizeCanvas);

        const particlesArr = [];
        const particleNum = 50;

        class Particle {
            constructor() {
                this.reset();
            }

            reset() {
                this.x = Math.random() * canvas.width;
                this.y = Math.random() * canvas.height;
                this.size = Math.random() * 7 + 2;
                this.speedY = -(Math.random() * 0.7 + 0.2);
                this.speedX = (Math.random() - 0.5) * 0.4;
                this.opacity = Math.random() * 0.8 + 0.2;
                this.type = Math.random() > 0.45 ? 'heart' : (Math.random() > 0.5 ? 'star' : 'dot');
                this.color = Math.random() > 0.5 ? '#ff4081' : '#ffcc00';
            }

            update() {
                this.y += this.speedY;
                this.x += this.speedX;

                if (this.y < -10) {
                    this.y = canvas.height + 10;
                    this.x = Math.random() * canvas.width;
                }
            }

            draw() {
                ctx.save();
                ctx.globalAlpha = this.opacity;
                ctx.fillStyle = this.color;

                if (this.type === 'heart') {
                    ctx.beginPath();
                    let topHeight = this.size * 0.3;
                    ctx.moveTo(this.x, this.y + topHeight);
                    ctx.bezierCurveTo(this.x, this.y, this.x - this.size / 2, this.y, this.x - this.size / 2, this.y + topHeight);
                    ctx.bezierCurveTo(this.x - this.size / 2, this.y + (this.size + topHeight) / 2, this.x, this.y + this.size, this.x, this.y + this.size);
                    ctx.bezierCurveTo(this.x, this.y + (this.size + topHeight) / 2, this.x + this.size / 2, this.y + (this.size + topHeight) / 2, this.x + this.size / 2, this.y + topHeight);
                    ctx.bezierCurveTo(this.x + this.size / 2, this.y, this.x, this.y, this.x, this.y + topHeight);
                    ctx.closePath();
                    ctx.fill();
                } else if (this.type === 'star') {
                    ctx.beginPath();
                    for (let i = 0; i < 5; i++) {
                        ctx.lineTo(Math.cos((18 + i * 72) * Math.PI / 180) * this.size + this.x,
                                   -Math.sin((18 + i * 72) * Math.PI / 180) * this.size + this.y);
                        ctx.lineTo(Math.cos((54 + i * 72) * Math.PI / 180) * (this.size / 2) + this.x,
                                   -Math.sin((54 + i * 72) * Math.PI / 180) * (this.size / 2) + this.y);
                    }
                    ctx.closePath();
                    ctx.fill();
                } else {
                    ctx.beginPath();
                    ctx.arc(this.x, this.y, this.size / 3, 0, Math.PI * 2);
                    ctx.fill();
                }
                ctx.restore();
            }
        }

        for (let i = 0; i < particleNum; i++) {
            particlesArr.push(new Particle());
        }

        function renderParticles() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            particlesArr.forEach(p => {
                p.update();
                p.draw();
            });
            requestAnimationFrame(renderParticles);
        }
        renderParticles();

        // Live Countdown Logic
        let totalSeconds = (2 * 3600) + (15 * 60) + 37; // Initialized to 02:15:37

        const hoursEl = document.getElementById('hours');
        const minutesEl = document.getElementById('minutes');
        const secondsEl = document.getElementById('seconds');
        const letsGoBtn = document.getElementById('lets-go-btn');

        function updateCountdown() {
            if (totalSeconds <= 0) {
                clearInterval(timerInterval);
                hoursEl.textContent = "00";
                minutesEl.textContent = "00";
                secondsEl.textContent = "00";
                
                // Show "Let's Go!" Button upon timer completion
                letsGoBtn.style.display = "block";
                return;
            }

            totalSeconds--;

            const h = Math.floor(totalSeconds / 3600);
            const m = Math.floor((totalSeconds % 3600) / 60);
            const s = totalSeconds % 60;

            hoursEl.textContent = h < 10 ? '0' + h : h;
            minutesEl.textContent = m < 10 ? '0' + m : m;
            secondsEl.textContent = s < 10 ? '0' + s : s;
        }

        const timerInterval = setInterval(updateCountdown, 1000);

        // Action on "Let's Go!" Click
        letsGoBtn.addEventListener('click', () => {
            alert("The surprise is ready! Entering the Birthday Experience...");
        });
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Birthday Experience</title>
    <!-- Google Fonts for Typography matching design -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Poppins:wght@400;600;700&family=Fredoka:wght@500;600&display=swap" rel="stylesheet">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
        }

        body {
            background-color: #0b0213;
            font-family: 'Poppins', sans-serif;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
        }

        /* Phone Screen Container */
        .app-container {
            width: 100%;
            max-width: 430px;
            height: 100vh;
            max-height: 932px;
            position: relative;
            background: url('1000260983.png') center top / cover no-repeat;
            box-shadow: 0 0 50px rgba(255, 0, 128, 0.2);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* Hide Original "SCENE 1" text block from background image */
        .scene-mask {
            position: absolute;
            top: 15.5%;
            width: 80%;
            height: 30px;
            background: radial-gradient(ellipse at center, rgba(15, 3, 25, 0.95) 0%, rgba(15, 3, 25, 0.8) 70%, transparent 100%);
            border-radius: 20px;
            z-index: 2;
        }

        /* Top Header Icons */
        .top-bar {
            width: 100%;
            display: flex;
            justify-content: space-between;
            padding: 20px 25px;
            z-index: 10;
        }

        .icon-btn {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(5px);
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            color: #fff;
            font-size: 16px;
            transition: transform 0.2s, background 0.2s;
        }

        .icon-btn:active {
            transform: scale(0.9);
        }

        /* Animated Floating Hearts Particles */
        .heart-particle {
            position: absolute;
            color: #ff3385;
            font-size: 14px;
            pointer-events: none;
            animation: floatUp 4s infinite ease-in-out;
            opacity: 0.7;
            z-index: 3;
            filter: drop-shadow(0 0 5px #ff007f);
        }

        @keyframes floatUp {
            0% { transform: translateY(0) scale(0.8) rotate(0deg); opacity: 0; }
            50% { opacity: 0.8; }
            100% { transform: translateY(-120px) scale(1.2) rotate(20deg); opacity: 0; }
        }

        /* Breathing Animation for Teddy area interaction */
        .teddy-breathing-layer {
            position: absolute;
            top: 30%;
            width: 100%;
            height: 300px;
            z-index: 4;
            animation: floatTeddy 3s ease-in-out infinite alternate;
            pointer-events: none;
        }

        @keyframes floatTeddy {
            0% { transform: translateY(0px); }
            100% { transform: translateY(-6px); }
        }

        /* Dynamic Speech Bubble Overlay */
        .speech-bubble {
            position: absolute;
            top: 31%;
            right: 12%;
            background: radial-gradient(circle, #33001b 0%, #1a000e 100%);
            border: 2px solid #ff007f;
            box-shadow: 0 0 15px #ff007f, inset 0 0 10px rgba(255, 0, 128, 0.5);
            border-radius: 25px;
            padding: 12px 20px;
            color: #ffffff;
            font-family: 'Fredoka', sans-serif;
            font-size: 15px;
            font-weight: 500;
            text-align: center;
            z-index: 10;
            animation: pulseGlow 2s infinite alternate;
            transition: all 0.5s ease;
        }

        .speech-bubble::before, .speech-bubble::after {
            content: '';
            position: absolute;
            background: #1a000e;
            border: 2px solid #ff007f;
            border-radius: 50%;
        }

        .speech-bubble::before {
            width: 10px;
            height: 10px;
            bottom: -12px;
            left: 20px;
        }

        .speech-bubble::after {
            width: 6px;
            height: 6px;
            bottom: -20px;
            left: 12px;
        }

        @keyframes pulseGlow {
            0% { box-shadow: 0 0 10px #ff007f, inset 0 0 5px rgba(255, 0, 128, 0.5); }
            100% { box-shadow: 0 0 22px #ff00aa, inset 0 0 12px rgba(255, 0, 128, 0.8); }
        }

        /* Interactive Timer Container Overlay */
        .timer-card {
            position: absolute;
            bottom: 23%;
            width: 88%;
            background: rgba(20, 5, 28, 0.85);
            border: 2px solid #a100ff;
            box-shadow: 0 0 20px rgba(161, 0, 255, 0.6), inset 0 0 15px rgba(255, 0, 128, 0.3);
            border-radius: 20px;
            padding: 15px 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
            backdrop-filter: blur(8px);
            z-index: 10;
        }

        .timer-title {
            font-size: 16px;
            font-weight: 600;
            letter-spacing: 0.5px;
            color: #ffffff;
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 12px;
        }

        .timer-display {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            width: 100%;
        }

        .time-box {
            background: rgba(10, 0, 18, 0.9);
            border: 1px solid #ff00aa;
            box-shadow: inset 0 0 8px rgba(255, 0, 170, 0.5), 0 0 10px rgba(255, 0, 170, 0.3);
            border-radius: 12px;
            width: 75px;
            height: 55px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Fredoka', sans-serif;
            font-size: 28px;
            font-weight: 600;
            color: #ffea00;
            text-shadow: 0 0 8px rgba(255, 234, 0, 0.8);
        }

        .time-colon {
            font-size: 24px;
            font-weight: bold;
            color: #ff00aa;
            text-shadow: 0 0 8px #ff00aa;
        }

        .time-labels {
            display: flex;
            justify-content: space-around;
            width: 100%;
            margin-top: 6px;
            padding: 0 10px;
            font-size: 11px;
            color: #d1bdff;
        }

        /* "Let's Go" Action Button */
        .lets-go-btn {
            display: none;
            width: 88%;
            padding: 16px 0;
            background: linear-gradient(135deg, #ff007f, #a100ff);
            border: 2px solid #ffffff;
            border-radius: 30px;
            color: #ffffff;
            font-family: 'Fredoka', sans-serif;
            font-size: 22px;
            font-weight: 600;
            letter-spacing: 1px;
            text-align: center;
            text-transform: uppercase;
            box-shadow: 0 0 25px #ff007f, 0 0 10px #ffea00;
            cursor: pointer;
            z-index: 20;
            position: absolute;
            bottom: 23%;
            animation: bounceBtn 1.5s infinite alternate;
        }

        @keyframes bounceBtn {
            0% { transform: scale(1); box-shadow: 0 0 20px #ff007f; }
            100% { transform: scale(1.05); box-shadow: 0 0 35px #ff00aa, 0 0 15px #ffea00; }
        }

        /* Helper Quick Test Button (To test timer end state instantly) */
        .dev-override {
            position: absolute;
            bottom: 5px;
            font-size: 10px;
            color: rgba(255, 255, 255, 0.3);
            cursor: pointer;
            z-index: 30;
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <div class="app-container" id="appContainer">
        <!-- Mask overlay to cover "SCENE 1" text from standard background image -->
        <div class="scene-mask"></div>

        <!-- Floating Particles Layer -->
        <div class="heart-particle" style="left: 15%; top: 60%; animation-delay: 0s;">💗</div>
        <div class="heart-particle" style="left: 80%; top: 55%; animation-delay: 1.5s;">💖</div>
        <div class="heart-particle" style="left: 10%; top: 40%; animation-delay: 2.5s;">💕</div>

        <!-- Header Bar -->
        <div class="top-bar">
            <div class="icon-btn" id="musicToggle">🎵</div>
            <div class="icon-btn" id="soundToggle">🔊</div>
        </div>

        <!-- Breathing Teddy Effect Overlay -->
        <div class="teddy-breathing-layer"></div>

        <!-- Teddy Thinking Bubble -->
        <div class="speech-bubble" id="speechBubble">
            What's the<br>surprise? 🤔
        </div>

        <!-- Countdown Timer Block -->
        <div class="timer-card" id="timerCard">
            <div class="timer-title">
                <span>💖</span> <span>Surprise Reveals In</span> <span>💖</span>
            </div>
            <div class="timer-display">
                <div class="time-box" id="hours">00</div>
                <div class="time-colon">:</div>
                <div class="time-box" id="minutes">00</div>
                <div class="time-colon">:</div>
                <div class="time-box" id="seconds">10</div>
            </div>
            <div class="time-labels">
                <span>Hours</span>
                <span>Minutes</span>
                <span>Seconds</span>
            </div>
        </div>

        <!-- Let's Go Button (Appears when timer hits 00:00:00) -->
        <button class="lets-go-btn" id="letsGoBtn">LET'S GO! 🚀</button>

        <!-- Developer Shortcut to test Timer End instantly -->
        <div class="dev-override" onclick="triggerTimerComplete()">[Test Timer Finish]</div>
    </div>

    <script>
        /* --- Web Audio API Synthesizers (No external files needed) --- */
        let audioCtx = null;
        let isMusicPlaying = false;
        let musicInterval = null;

        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
        }

        // Water Bubble Sound Effect Synthesizer
        function playWaterBubbleSound() {
            initAudio();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();

            osc.type = 'sine';
            
            // Frequency sweep simulating liquid bubble pop
            const startFreq = 300 + Math.random() * 150;
            const endFreq = startFreq + 400 + Math.random() * 200;

            osc.frequency.setValueAtTime(startFreq, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(endFreq, audioCtx.currentTime + 0.08);

            gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.08);

            osc.connect(gain);
            gain.connect(audioCtx.destination);

            osc.start();
            osc.stop(audioCtx.currentTime + 0.08);
        }

        // Soft Ambient Chimes Melody Generator
        function playSoftNote() {
            if (!isMusicPlaying || !audioCtx) return;

            const notes = [261.63, 293.66, 329.63, 392.00, 440.00, 523.25]; // Pentatonic C scale
            const freq = notes[Math.floor(Math.random() * notes.length)];

            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();

            osc.type = 'sine';
            osc.frequency.setValueAtTime(freq, audioCtx.currentTime);

            gain.gain.setValueAtTime(0, audioCtx.currentTime);
            gain.gain.linearRampToValueAtTime(0.05, audioCtx.currentTime + 0.3);
            gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 2.5);

            osc.connect(gain);
            gain.connect(audioCtx.destination);

            osc.start();
            osc.stop(audioCtx.currentTime + 2.5);
        }

        function toggleMusic() {
            initAudio();
            isMusicPlaying = !isMusicPlaying;
            const musicBtn = document.getElementById('musicToggle');

            if (isMusicPlaying) {
                musicBtn.style.background = "rgba(255, 0, 128, 0.5)";
                musicInterval = setInterval(playSoftNote, 800);
            } else {
                musicBtn.style.background = "rgba(255, 255, 255, 0.1)";
                clearInterval(musicInterval);
            }
        }

        /* --- Click Event Listener for Water Bubble Sound --- */
        document.getElementById('appContainer').addEventListener('click', (e) => {
            // Play bubble sound on every touch/click
            playWaterBubbleSound();
        });

        document.getElementById('musicToggle').addEventListener('click', (e) => {
            e.stopPropagation(); // Avoid duplicate bubble trigger
            playWaterBubbleSound();
            toggleMusic();
        });

        /* --- Countdown Timer Logic --- */
        let totalSeconds = 10; // Set initial countdown length in seconds

        const hoursEl = document.getElementById('hours');
        const minutesEl = document.getElementById('minutes');
        const secondsEl = document.getElementById('seconds');
        const speechBubble = document.getElementById('speechBubble');
        const timerCard = document.getElementById('timerCard');
        const letsGoBtn = document.getElementById('letsGoBtn');

        function updateTimer() {
            if (totalSeconds <= 0) {
                clearInterval(timerCountdown);
                triggerTimerComplete();
                return;
            }

            totalSeconds--;

            const hrs = Math.floor(totalSeconds / 3600);
            const mins = Math.floor((totalSeconds % 3600) / 60);
            const secs = totalSeconds % 60;

            hoursEl.textContent = String(hrs).padStart(2, '0');
            minutesEl.textContent = String(mins).padStart(2, '0');
            secondsEl.textContent = String(secs).padStart(2, '0');
        }

        function triggerTimerComplete() {
            hoursEl.textContent = "00";
            minutesEl.textContent = "00";
            secondsEl.textContent = "00";

            // Update Teddy's Thinking Text
            speechBubble.innerHTML = "Let's Go! 🎉";
            speechBubble.style.transform = "scale(1.1)";
            speechBubble.style.borderColor = "#ffea00";

            // Hide Timer and Display "Let's Go" Button
            timerCard.style.display = "none";
            letsGoBtn.style.display = "block";
        }

        // Start Countdown Interval
        const timerCountdown = setInterval(updateTimer, 1000);

        // Action when "Let's Go" Button is clicked
        letsGoBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            playWaterBubbleSound();
            alert("✨ Surprise Unlocked! Proceeding to the next page... ✨");
        });
    </script>
</body>
</html>

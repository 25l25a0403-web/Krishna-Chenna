<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>A Magical Evening</title>
  <style>
    /* Reset and Base Styles */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Georgia', serif;
      color: #fff;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      /* Replace 'background.jpg' with your image file path */
      background: url('image/file_00000000502c81fd8f419583ca2f564c.png') no-repeat center center fixed;
      background-size: cover;
    }

    /* Glassmorphism Card Overlay */
    .content-card {
      background: rgba(20, 10, 25, 0.65);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      border: 1px solid rgba(255, 182, 193, 0.2);
      border-radius: 16px;
      padding: 2.5rem;
      max-width: 500px;
      width: 90%;
      text-align: center;
      box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.5);
    }

    h1 {
      font-size: 2.2rem;
      color: #ffb7c5; /* Soft rose color matching the glow */
      margin-bottom: 1rem;
      text-shadow: 0 0 10px rgba(255, 183, 197, 0.5);
    }

    p {
      font-size: 1.1rem;
      line-height: 1.6;
      color: #f3e5f5;
      margin-bottom: 1.5rem;
    }

    .btn {
      display: inline-block;
      padding: 0.8rem 1.8rem;
      color: #fff;
      background: linear-gradient(135deg, #e91e63, #9c27b0);
      border: none;
      border-radius: 25px;
      text-decoration: none;
      font-weight: bold;
      letter-spacing: 1px;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
      box-shadow: 0 4px 15px rgba(233, 30, 99, 0.4);
    }

    .btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(233, 30, 99, 0.6);
    }
  </style>
</head>
<body>

  <main class="content-card">
    <h1>An Evening to Remember</h1>
    <p>Join us on a walk down this magical cobblestone lane as we celebrate romance, light, and memorable moments.</p>
    <a href="#" class="btn">Explore More</a>
  </main>

</body>
</html>

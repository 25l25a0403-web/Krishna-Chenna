<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Birthday Surprise</title>
  <style>
    /* Reset & Fonts */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      /* Glowing bokeh background with dark purple aesthetic */
      background: radial-gradient(circle at 50% 30%, #3a0d31 0%, #17041a 60%, #0a010c 100%);
      color: #ffffff;
      overflow-x: hidden;
      padding: 20px 10px;
    }

    /* Main Container Card */
    .container {
      width: 100%;
      max-width: 420px;
      background: rgba(25% , 8%, 28%, 0.45);
      border: 1px solid rgba(255, 105, 180, 0.25);
      border-radius: 28px;
      padding: 20px;
      box-shadow: 0 0 35px rgba(230, 50, 150, 0.25), inset 0 0 15px rgba(255, 105, 180, 0.1);
      backdrop-filter: blur(10px);
      display: flex;
      flex-direction: column;
      align-items: center;
      position: relative;
    }

    /* Top Controls */
    .top-bar {
      width: 100%;
      display: flex;
      justify-content: space-between;
      margin-bottom: 20px;
    }

    .icon-btn {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 105, 180, 0.3);
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      cursor: pointer;
      box-shadow: 0 0 10px rgba(255, 105, 180, 0.2);
    }

    /* Animated Teddy & Clock Stage */
    .scene-container {
      position: relative;
      width: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      margin: 10px 0 20px 0;
    }

    /* Gentle Floating Motion Animation for Teddy */
    .teddy-img {
      width: 220px;
      height: auto;
      filter: drop-shadow(0 10px 15px rgba(0, 0, 0, 0.6));
      animation: gentleMotion 3.5s ease-in-out infinite alternate;
    }

    @keyframes gentleMotion {
      0% {
        transform: translateY(0px) rotate(0deg) scale(1);
      }
      50% {
        transform: translateY(-8px) rotate(-1deg) scale(1.02);
      }
      100% {
        transform: translateY(-4px) rotate(1deg) scale(1.01);
      }
    }

    /* Thought Bubble */
    .thought-bubble {
      position: absolute;
      top: -10px;
      right: 20px;
      background: rgba(45, 10, 40, 0.9);
      border: 2px solid #ff42a1;
      border-radius: 20px;
      padding: 10px 15px;
      font-size: 14px;
      color: #fff;
      font-weight: 600;
      box-shadow: 0 0 12px rgba(255, 66, 161, 0.4);
      animation: floatBubble 3s ease-in-out infinite alternate;
    }

    @keyframes floatBubble {
      0% { transform: translateY(0); }
      100% { transform: translateY(-5px); }
    }

    /* Countdown Panel */
    .timer-card {
      width: 100%;
      background: rgba(30, 5, 30, 0.7);
      border: 1px solid rgba(255, 66, 161, 0.4);
      border-radius: 20px;
      padding: 16px;
      text-align: center;
      box-shadow: inset 0 0 10px rgba(255, 66, 161, 0.15);
      margin-bottom: 15px;
    }

    .timer-title {
      color: #ff91d3;
      font-size: 14px;
      letter-spacing: 0.5px;
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    .countdown-display {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 12px;
    }

    .time-box {
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .digit {
      background: rgba(15, 2, 18, 0.8);
      border: 1px solid #ff91d3;
      color: #ffea79;
      font-size: 26px;
      font-weight: bold;
      padding: 8px 14px;
      border-radius: 12px;
      box-shadow: 0 0 12px rgba(255, 234, 121, 0.3);
      min-width: 55px;
    }

    .label {
      font-size: 11px;
      color: #d1a5c9;
      margin-top: 6px;
    }

    .colon {
      font-size: 24px;
      color: #ff42a1;
      font-weight: bold;
      margin-bottom: 18px;
    }

    /* Message Box */
    .wish-box {
      width: 100%;
      border: 1px dashed rgba(255, 145, 211, 0.5);
      border-radius: 16px;
      padding: 12px 15px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 15px;
      background: rgba(20, 3, 22, 0.4);
    }

    .wish-text {
      font-size: 12px;
      color: #e2c0db;
      text-align: center;
      line-height: 1.4;
    }

    .wish-text span {
      color: #ffea79;
    }

    /* Notification Panel */
    .notif-box {
      width: 100%;
      background: rgba(30, 5, 30, 0.6);
      border: 1px solid rgba(255, 145, 211, 0.3);
      border-radius: 16px;
      padding: 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 12px;
      color: #e2c0db;
    }

    /* Hidden "Let's Go" Button Revealed When Timer Hits 0 */
    .lets-go-btn {
      display: none; /* Initially hidden */
      width: 100%;
      padding: 14px;
      margin-top: 10px;
      background: linear-gradient(135deg, #ff42a1, #ffea79);
      color: #17041a;
      font-size: 18px;
      font-weight: bold;
      border: none;
      border-radius: 16px;
      cursor: pointer;
      box-shadow: 0 0 20px rgba(255, 66, 161, 0.6);
      transition: transform 0.2s ease, box-shadow 0.2s ease;
      text-align: center;
      text-decoration: none;
    }

    .lets-go-btn:hover {
      transform: scale(1.03);
      box-shadow: 0 0 25px rgba(255, 234, 121, 0.8);
    }
  </style>
</head>
<body>

  <div class="container">
    <!-- Top Action Icons -->
    <div class="top-bar">
      <button class="icon-btn">🎵</button>
      <button class="icon-btn">🔊</button>
    </div>

    <!-- Motion Teddy Section -->
    <div class="scene-container">
      <!-- Replace 'teddy-image.png' with your teddy image file or URL -->
      <img src="https://i.ibb.co/L6S35G2/teddy.png" alt="Teddy Bear" class="teddy-img">
      <div class="thought-bubble">What's the surprise? 🤔</div>
    </div>

    <!-- Countdown Timer Card -->
    <div class="timer-card" id="timer-container">
      <div class="timer-title">
        <span>💖</span> Surprise Reveals In <span>💖</span>
      </div>
      <div class="countdown-display">
        <div class="time-box">
          <div class="digit" id="hours">00</div>
          <div class="label">Hours</div>
        </div>
        <div class="colon">:</div>
        <div class="time-box">
          <div class="digit" id="minutes">00</div>
          <div class="label">Minutes</div>
        </div>
        <div class="colon">:</div>
        <div class="time-box">
          <div class="digit" id="seconds">00</div>
          <div class="label">Seconds</div>
        </div>
      </div>
    </div>

    <!-- Message Section -->
    <div class="wish-box">
      <span style="font-size: 20px;">⭐</span>
      <div class="wish-text">
        Your <span>special wish</span> is on the way...<br>
        Hang tight, it will be worth the wait!
      </div>
      <span style="font-size: 20px;">💖</span>
    </div>

    <!-- Status Banner -->
    <div class="notif-box" id="notif-box">
      <span style="font-size: 16px;">⏰</span>
      <span>You will get a notification when the surprise is ready!</span>
      <span style="font-size: 16px;">🔔</span>
    </div>

    <!-- Revealable "Let's Go!" Button -->
    <a href="#next-page" class="lets-go-btn" id="letsGoBtn">LET'S GO! 🎉</a>
  </div>

  <script>
    // Set target reveal time (e.g., 2 hours, 15 minutes, 37 seconds from now)
    // Adjust this target date/time to your brother's birthday moment!
    const targetTime = new Date().getTime() + (2 * 3600 + 15 * 60 + 37) * 1000;

    function updateCountdown() {
      const now = new Date().getTime();
      const difference = targetTime - now;

      if (difference <= 0) {
        // Time completed
        document.getElementById('hours').innerText = '00';
        document.getElementById('minutes').innerText = '00';
        document.getElementById('seconds').innerText = '00';

        // Show "Let's Go" button and hide static notification
        document.getElementById('letsGoBtn').style.display = 'block';
        document.getElementById('notif-box').style.display = 'none';
        
        clearInterval(timerInterval);
        return;
      }

      // Calculations
      const hours = Math.floor((difference % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
      const minutes = Math.floor((difference % (1000 * 60 * 60)) / (1000 * 60));
      const seconds = Math.floor((difference % (1000 * 60)) / 1000);

      // Display formatted digits
      document.getElementById('hours').innerText = String(hours).padStart(2, '0');
      document.getElementById('minutes').innerText = String(minutes).padStart(2, '0');
      document.getElementById('seconds').innerText = String(seconds).padStart(2, '0');
    }

    // Run interval
    const timerInterval = setInterval(updateCountdown, 1000);
    updateCountdown();
  </script>
</body>
</html>
